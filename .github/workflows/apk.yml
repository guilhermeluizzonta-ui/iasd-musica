name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Montar o app (fontes e PDF.js locais)
        run: npm run build:web

      - name: Sincronizar com o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/IASD-Musica-v0.1.${{ github.run_number }}.apk"

      - name: Guardar APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: IASD-Musica-v0.1.${{ github.run_number }}
          path: IASD-Musica-v0.1.${{ github.run_number }}.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: IASD Música v0.1.${{ github.run_number }}
          body: Versão de teste. Para instalar, baixe o .apk no tablet ou celular e permita "instalar apps de fontes desconhecidas".
          prerelease: true
          files: IASD-Musica-v0.1.${{ github.run_number }}.apk
